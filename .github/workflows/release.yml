name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # `prepublishOnly` re-runs the checks, so a bad tag can never ship.
      # Uses npm trusted publishing (OIDC) — configure it on npmjs.com under
      # the package's "Publishing access" settings, no NPM_TOKEN needed.
      - run: npm publish --provenance --access public
